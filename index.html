<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>깨비랑 - 도깨비가 들려주는 당신의 2027년 이야기</title>
    <link rel="stylesheet" href="./assets/styles/style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css" />

    <!-- 공통 레이아웃 웹 컴포넌트 스크립트 연결 -->
    <script src="./common/layout.js"></script>
    <script>
      (function () {
        const userAgent = navigator.userAgent.toLowerCase();
        if (userAgent.includes("kakaotalk")) {
          const currentUrl = window.location.href;
          if (userAgent.includes("android")) {
            location.href = "intent://" + currentUrl.replace(/https?:\/\//, "") + "#Intent;scheme=http;package=com.android.chrome;end";
          } else if (userAgent.includes("iphone") || userAgent.includes("ipad")) {
            location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(currentUrl);
          }
        }
      })();
    </script>
  </head>
  <body>
    <main class="kkaebi-container">
      <div class="kkaebi-light"></div>

      <!-- 공통 커스텀 헤더 컴포넌트 조립 -->
      <kkaebi-header></kkaebi-header>

      <!-- 사용자 정보 입력 전용 단독 세션 -->
      <section id="kkaebi-step-input" class="kkaebi-step-content active">
        <div class="kkaebi-intro">
          <p class="sub-title">도깨비가 들려주는</p>
          <h2 class="main-title">당신의 2027년 이야기</h2>
        </div>

        <form class="kkaebi-form" id="fortuneForm" onsubmit="return false;">
          <div class="input-group-row">
            <!-- 이름 입력 칸 -->
            <div class="input-group name-group">
              <label for="userName" class="input-icon">
                <svg xmlns="http://w3.org" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                  <circle cx="12" cy="7" r="4" />
                </svg>
              </label>
              <input type="text" id="userName" placeholder="이름" required autocomplete="off" />
            </div>

            <!-- 성별 선택 영역 (버튼 토글 그룹) -->
            <div class="gender-group">
              <button type="button" class="btn-gender active" data-gender="male">남</button>
              <button type="button" class="btn-gender" data-gender="female">여</button>
            </div>
          </div>

          <!-- 생년월일 및 태어난 시간 입력란 -->
          <div class="input-group-row">
            <div class="input-group select-group">
              <label for="birthDate" class="input-icon">
                <svg xmlns="http://w3.org" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                  <line x1="16" y1="2" x2="16" y2="6" />
                  <line x1="8" y1="2" x2="8" y2="6" />
                  <line x1="3" y1="10" x2="21" y2="10" />
                </svg>
              </label>
              <div class="select-wrapper">
                <span class="select-label">생년월일 및 태어난 시간</span>
                <input type="text" id="birthDate" placeholder="YYYY.MM.DD HH:MM" required autocomplete="off" />
              </div>

              <div class="arrow-icon" id="calendarIconBtn" style="cursor: pointer">
                <svg xmlns="http://w3.org" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                  <line x1="16" y1="2" x2="16" y2="6" />
                  <line x1="8" y1="2" x2="8" y2="6" />
                  <line x1="3" y1="10" x2="21" y2="10" />
                  <path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01" />
                </svg>
              </div>
            </div>
            <!-- 음력 선택 -->
            <div class="gender-group lunar">
              <label class="lunar-toggle-label">
                <input type="checkbox" id="isLunar" class="hidden-checkbox" />
                <div class="btn-lunar-fake">음력</div>
              </label>
            </div>
          </div>
          <!-- 시간 모름 추가 -->
          <div class="input-group-row">
            <div class="unknown-time-container">
              <label class="unknown-time-label" for="unknownTime">
                <input type="checkbox" id="unknownTime" class="checkbox-time" />
                시간 모름
              </label>
            </div>
          </div>
          <button type="submit" class="btn-submit" id="submitBtn">
            <span class="btn-text">2027년 오행풀이 및 총운 확인하기</span>
            <span class="kkaebi-spinner hidden"></span>
          </button>
          <button type="submit" class="btn-submit btn-goto-today" id="goToTodayDirectBtn">
            <span class="btn-text">오늘 하루의 운세 보러가기</span>
            <span class="kkaebi-spinner hidden"></span>
          </button>
        </form>
      </section>

      <!-- 공통 커스텀 푸터 컴포넌트 조립 -->
      <kkaebi-footer></kkaebi-footer>
    </main>

    <!-- 💡 [신규 추가] 이전 기록 불러오기 전용 커스텀 팝업 모달 -->
    <div id="kkaebiLoadModal" class="modal-overlay hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h4 class="modal-title">이전 조회 기록을 발견했어 깨비!</h4>
        </div>
        <div class="modal-body">
          <p class="modal-desc" style="margin-bottom: 20px">
            이전에 깨비랑에서 운세를 조회하셨던 정보가 남아있습니다.
            <br />
            기존 정보를 그대로 불러올까요, 아니면 새로 입력할까요?
          </p>
          <div class="modal-action-zone" style="display: flex; gap: 10px; width: 100%">
            <button type="button" id="btnLoadFresh" class="btn-modal-close-today">새로하기</button>
            <button type="button" id="btnLoadCached" class="btn-modal">불러오기</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 날짜 에디터 플러그인 모듈 확보 -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ko.js"></script>
    <script src="./assets/js/input.js"></script>
  </body>
</html>
